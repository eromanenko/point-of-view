<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#e6007e">
  <meta name="description"
    content="PoV translate — scan QR codes from Point of View board game cards to read them in your language">
  <title>PoV translate</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon_round.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="app-container" class="app-container">
    <!-- Language Button (always visible, top-right) -->
  <div id="lang-bar" class="lang-bar">
    <button id="lang-btn" class="lang-btn" aria-label="Change language">EN</button>
    <div id="lang-menu" class="lang-menu hidden">
      <button class="lang-option" data-lang="EN">EN</button>
      <button class="lang-option" data-lang="DE">DE</button>
      <button class="lang-option" data-lang="UK">UK</button>
      <button class="lang-option" data-lang="RU">RU</button>
    </div>
  </div>

  <!-- Card Number & Close Button (always visible when any card is shown) -->
  <button id="card-number-btn" class="card-number-btn hidden" aria-label="Close card">
    <span id="card-number-text"></span>
    <span class="close-icon">✕</span>
  </button>

  <!-- Placeholder Screen -->
  <div id="placeholder-screen" class="screen placeholder-screen active">
    <div class="placeholder-content">
      <img src="assets/icon_round.png" alt="PoV" class="placeholder-logo">
      <h1 class="placeholder-title">PoV translate</h1>
      <div class="placeholder-hint">
        <div class="scan-icon" id="center-scan-icon">
          <img src="assets/finger-print.svg" alt="Scan" class="fingerprint-icon">
        </div>
        <p id="placeholder-text">Hold your finger on screen to scan QR code</p>
      </div>
    </div>
    <div class="app-version">v1.0.4</div>
  </div>

  <!-- Card View Screen -->
  <div id="card-screen" class="screen card-screen">
    <div class="card-bg" id="card-bg"></div>
    <div class="card-body">
      <div id="card-title" class="card-title hidden"></div>
      <div id="card-text" class="card-text"></div>
      <div id="card-question" class="card-question hidden"></div>
      <div id="card-stars" class="card-stars hidden"></div>
    </div>
  </div>

  <!-- Image View Screen -->
  <div id="image-screen" class="screen image-screen">
    <div class="image-container" id="image-container">
      <img id="image-view" class="image-view" alt="Card image">
    </div>
  </div>

  <!-- Camera Overlay -->
  <div id="camera-overlay" class="camera-overlay hidden">
    <div id="camera-container" class="camera-container"></div>
    <div id="camera-border" class="camera-border"></div>
    <div id="camera-card-number" class="camera-card-number hidden"></div>
  </div>

  <!-- Scan FAB (Floating Action Button) for cards -->
  <button id="scan-fab" class="scan-fab hidden" aria-label="Scan new card">
    <img src="assets/finger-print.svg" alt="Scan" class="fingerprint-icon">
  </button>

  <!-- Ghost Icon for Animation -->
  <img src="assets/finger-print.svg" id="ghost-icon" class="ghost-icon hidden" alt="Scan">

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>
  </div>

  <script src="lib/html5-qrcode.min.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/card-renderer.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          console.log('ServiceWorker registered with scope:', reg.scope);
        }).catch((err) => {
          console.log('ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
</body>

</html>
